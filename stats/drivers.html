<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drivers | Vaucluse Raceway</title>
  <meta name="description" content="Every Vaucluse Raceway driver — events entered, event-by-event results, knockout wins and personal-best lap times.">
  <link rel="canonical" href="https://results.vaucluseraceway.com/stats/drivers">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png?v=10">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=10">

  <link rel="preload" href="/fonts/racing-sans-one-400.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/css/tokens.css?v=21">
  <link rel="stylesheet" href="/css/shell.css?v=31">
  <link rel="stylesheet" href="/css/stats.css?v=8">

  <script defer src="/config.js?v=20"></script>
  <script defer src="/js/shell.js?v=21"></script>
  <script defer src="/js/results-parse.js?v=3"></script>
  <script defer src="/js/drivers.js?v=3"></script>
  <script defer src="/js/drivers-page.js?v=3"></script>
</head>
<body>

  <header class="vr-header">
    <div class="vr-header__inner">
      <a class="vr-logo" href="https://vaucluseraceway.com" aria-label="Vaucluse Raceway — main site">
        <img src="/assets/vr-logo.svg" alt="Vaucluse Raceway" width="188" height="68">
      </a>
      <nav class="vr-headnav" id="vrPagenav" aria-label="Results sections">
        <a class="vr-pagenav__link" href="/happening-now"><span class="vr-livedot" aria-hidden="true"></span>Happening Now</a>
        <a class="vr-pagenav__link" href="/past-events">Past Events</a>
        <div class="vr-navdrop" data-navdrop>
          <button type="button" class="vr-pagenav__link vr-navdrop__trigger is-active" aria-haspopup="true" aria-expanded="false">Stats <span class="vr-navdrop__caret" aria-hidden="true">▾</span></button>
          <div class="vr-navdrop__menu" role="menu">
            <a class="vr-navdrop__item" href="/stats" role="menuitem">Stats</a>
            <a class="vr-navdrop__item is-active" href="/stats/drivers" role="menuitem" aria-current="page">Drivers</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <button id="hamburger-btn" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav id="mobile-menu" aria-label="Mobile menu">
    <a href="/happening-now">Happening Now</a>
    <a href="/past-events">Past Events</a>
    <a href="/stats">Stats</a>
    <a class="vr-mobile-sub is-active" href="/stats/drivers" aria-current="page">Drivers</a>
    <a href="https://vaucluseraceway.com">Home</a>
  </nav>

  <main class="vr-main">
    <div class="vr-container">

      <a class="vr-btn vr-btn--ghost vr-back" href="/stats"><span class="vr-arrow">←</span> Back to stats</a>

      <div class="vr-state is-on" id="vrDsLoading">
        <div class="vr-spinner" aria-hidden="true"></div>
        <div class="vr-state__title"><em>Loading drivers…</em></div>
        <div class="vr-state__msg"> </div>
        <div class="vr-stats__progress" id="vrDsProgress"></div>
      </div>

      <div class="vr-state" id="vrDsError">
        <div class="vr-state__title">Couldn’t <em>load driver list</em></div>
        <div class="vr-state__msg">Something went wrong.</div>
        <button class="vr-btn" type="button" id="vrDsRetry">Try again <span class="vr-arrow">↻</span></button>
      </div>

      <div id="vrDsContent" style="display:none">
        <h1 class="vr-dstat-page__title"><em>Drivers</em></h1>

        <div class="vr-dstat-page__controls">
          <label class="vr-filterselect">
            <span class="vr-filterlabel">Search</span>
            <input type="search" id="vrDsSearch" placeholder="Driver name…" autocomplete="off">
          </label>
        </div>

        <div class="vr-dstat-page__count" id="vrDsCount"></div>
        <div id="vrDsList"></div>
        <div class="vr-stat-empty" id="vrDsNoMatch" style="display:none">No driver matches that search.</div>
      </div>

    </div>
  </main>

  <footer id="vrFooter"></footer>

</body>
</html>
