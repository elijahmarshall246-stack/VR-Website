<body>

  <header class="vr-header">
    <div class="vr-header__inner">
      <a class="vr-logo" href="https://vaucluseraceway.com/" aria-label="Vaucluse Raceway home">
        <img src="/assets/vr-logo.svg" alt="Vaucluse Raceway" width="188" height="68">
      </a>
      <nav class="vr-mainnav" aria-label="Main site">
        <a class="vr-mainnav__link" href="https://vaucluseraceway.com/">Home</a>
        <a class="vr-mainnav__link" href="https://vaucluseraceway.com/#about">About</a>
        <a class="vr-mainnav__link is-current" href="https://results.vaucluseraceway.com/">Results</a>
        <a class="vr-mainnav__link" href="https://vaucluseraceway.com/#bimmacup">BimmaCup</a>
        <a class="vr-mainnav__link" href="https://vaucluseraceway.com/#contact">Contact</a>
      </nav>
      <div class="vr-weather" id="vrWeather" role="group" aria-label="Current weather at Vaucluse Raceway">
        <div class="vwr-labels"><div class="vwr-l1">Vaucluse Raceway</div><div class="vwr-l2">Current weather</div></div>
        <div class="vwr-right"><div class="vwr-icon" id="vrWeatherIcon" aria-hidden="true"></div><div class="vwr-t" id="vrWeatherTemp">--°C</div></div>
      </div>
    </div>
  </header>

  <nav class="vr-subnav" id="vrPagenav" aria-label="Results sections">
    <div class="vr-subnav__inner">
      <a class="vr-pagenav__link" href="/">Results Home</a>
      <a class="vr-pagenav__link" href="/happening-now"><span class="vr-livedot" aria-hidden="true"></span>Happening Now</a>
      <a class="vr-pagenav__link" href="/past-events">Past Events</a>
      <div class="vr-navdrop" data-navdrop>
        <button type="button" class="vr-pagenav__link vr-navdrop__trigger is-active" aria-haspopup="true" aria-expanded="false">Stats <span class="vr-navdrop__caret" aria-hidden="true">▾</span></button>
        <div class="vr-navdrop__menu" role="menu">
          <a class="vr-navdrop__item is-active" aria-current="page" href="/stats" role="menuitem">Stats</a>
          <a class="vr-navdrop__item" href="/stats/drivers" role="menuitem">Drivers</a>
        </div>
      </div>
    </div>
  </nav>

  <button id="hamburger-btn" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav id="mobile-menu" aria-label="Mobile menu">
    <a href="https://vaucluseraceway.com/">Home</a>
    <a href="https://vaucluseraceway.com/#about">About</a>
    <a href="/">Results</a>
    <a class="vr-mobile-sub" href="/happening-now">Happening Now</a>
    <a class="vr-mobile-sub" href="/past-events">Past Events</a>
    <a class="vr-mobile-sub is-active" aria-current="page" href="/stats">Stats</a>
    <a class="vr-mobile-sub" href="/stats/drivers">Drivers</a>
    <a href="https://vaucluseraceway.com/#bimmacup">BimmaCup</a>
    <a href="https://vaucluseraceway.com/#contact">Contact</a>
  </nav>

  <main class="vr-main">
    <div class="vr-container">

      <div class="vr-state is-on" id="vrStatsLoading">
        <div class="vr-spinner" aria-hidden="true"></div>
        <div class="vr-state__title"><em>Loading stats…</em></div>
        <div class="vr-state__msg"> </div>
        <div class="vr-stats__progress" id="vrStatsProgress"></div>
      </div>

      <div class="vr-state" id="vrStatsError">
        <div class="vr-state__title">Couldn’t <em>load stats</em></div>
        <div class="vr-state__msg">Something went wrong.</div>
        <button class="vr-btn" type="button" id="vrStatsRetry">Try again <span class="vr-arrow">↻</span></button>
      </div>

      <div id="vrStatsContent" style="display:none">
        <div id="vrStatsBody"></div>
      </div>

    </div>
  </main>

  <footer id="vrFooter"></footer>
